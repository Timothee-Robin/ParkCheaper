name: Release Build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build Frontend
        run: |
          cd frontend
          npm ci
          npm run build
          cd ..

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Build Standalone Executable (PyInstaller)
        run: |
          pyinstaller --noconfirm PaybyPhoneBuyer.spec

      - name: Verify Executable CLI
        run: |
          dist\PaybyPhoneBuyer-cli.exe --help

      - name: Build Windows MSI Installer (WiX Toolset)
        run: |
          $env:PATH += ";C:\Program Files (x86)\WiX Toolset v3.11\bin"
          New-Item -ItemType Directory -Force -Path build
          candle.exe -arch x64 -ext WixUIExtension -out build\PaybyPhoneBuyer.wixobj installer\PaybyPhoneBuyer.wxs
          light.exe -ext WixUIExtension -out dist\PaybyPhoneBuyer.msi build\PaybyPhoneBuyer.wixobj

      - name: Generate Checksums
        run: |
          Get-FileHash dist\PaybyPhoneBuyer.exe, dist\PaybyPhoneBuyer-cli.exe, dist\PaybyPhoneBuyer.msi -Algorithm SHA256 |
            ForEach-Object { "$($_.Hash)  $(Split-Path $_.Path -Leaf)" } |
            Set-Content dist\SHA256SUMS.txt

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            dist/PaybyPhoneBuyer.msi
            dist/PaybyPhoneBuyer.exe
            dist/PaybyPhoneBuyer-cli.exe
            dist/SHA256SUMS.txt
          generate_release_notes: true
          draft: false
          prerelease: false

      - name: Upload Build Artifacts (for manual workflow runs)
        if: "!startsWith(github.ref, 'refs/tags/')"
        uses: actions/upload-artifact@v4
        with:
          name: PaybyPhoneBuyer-Windows-x64
          path: |
            dist/PaybyPhoneBuyer.msi
            dist/PaybyPhoneBuyer.exe
            dist/PaybyPhoneBuyer-cli.exe
            dist/SHA256SUMS.txt
